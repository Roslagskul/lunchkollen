<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f5f3ed"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.json"><title>Lunchkollen</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#263a32;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}main{max-width:480px;margin:auto;padding:24px 18px 100px}h1{font-size:32px;letter-spacing:-1.5px;margin:8px 0}h2{font-size:19px;margin:0 0 14px}p{line-height:1.5;color:#68776d}small{color:#68776d}section{background:#fff;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #263a3209}button,input{font:inherit}button{border:0;border-radius:13px;padding:14px;cursor:pointer;background:#edf1ea;color:#263a32}button.active{background:#335b48;color:white}button.primary{background:#335b48;color:white;width:100%;font-weight:650;margin-top:18px}button:disabled{opacity:.4}input{width:100%;padding:12px;border:1px solid #dce3da;border-radius:10px;background:white;color:#263a32}label{display:block;margin:12px 0 6px;font-weight:600}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{flex:1;min-width:80px;overflow-wrap:anywhere}nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;border-top:1px solid #e1e5df;display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:8px}nav button{background:transparent;min-width:85px;font-size:13px}nav button.active{background:#e1e9df;color:#335b48}.entry{padding:13px 0;border-bottom:1px solid #edf0eb;display:flex;justify-content:space-between;align-items:center;gap:10px}.entry:last-child{border:0}.entry button{padding:9px;font-size:13px}.big{font-size:38px;font-weight:650;letter-spacing:-2px}.bar{height:10px;background:#edf1ea;border-radius:12px;overflow:hidden;margin:8px 0 16px}.bar i{display:block;height:100%;background:#77947b;border-radius:12px}.muted{font-size:13px}#msg{min-height:24px;color:#335b48;font-weight:600;margin-top:10px}select{font:inherit;padding:10px;border:1px solid #dce3da;border-radius:10px;background:white;color:#263a32} .danger{color:#943f38} </style></head><body><main><small>EN LITEN SOCIAL DAGBOK</small><h1>Lunchkollen</h1><p id="subtitle">Goda luncher, trevligt sällskap.</p><div id="view"></div></main><nav id="nav"></nav><script>
const KEY='lunchkollen.v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{};if(!data||!Array.isArray(data.entries)||!Array.isArray(data.names))data={names:['Jag','Kollega 1','Kollega 2'],entries:[]};let tab=0,people=[0,1],payer=0,day=today(),period='all',notice='';function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{alert('Kunde inte spara lokalt. Kontrollera webbläsarens lagring.');return false}}function name(i){return esc(data.names[i])}function choose(i){if(i===0)return;people=people.includes(i)?people.filter(x=>x!==i):[...people,i].sort();if(!people.includes(payer))payer=0;render()}function pay(i){payer=i;render()}function add(){if(people.length<2||!day)return;let e={id:Date.now().toString(36)+Math.random().toString(36).slice(2),day,people:[...people],payer};data.entries.push(e);if(!save()){data.entries.pop();return}notice='Lunch sparad!';day=today();render()}function remove(id){if(confirm('Ta bort den här lunchen?')){let old=data.entries;data.entries=old.filter(e=>e.id!==id);if(!save())data.entries=old;render()}}function go(i){tab=i;notice='';render()}function filtered(){let d=today();return data.entries.filter(e=>period==='all'||(period==='month'?e.day.slice(0,7)===d.slice(0,7):e.day.slice(0,4)===d.slice(0,4)))}function entry(e){return `<div class="entry"><div><strong>${name(e.payer)} bjöd</strong><br><small>${esc(e.day)} · ${e.people.map(name).join(', ')}</small></div><button onclick="remove('${e.id}')" aria-label="Ta bort lunch">Ta bort</button></div>`}function stat(label,n,total){return `<div>${label} <strong style="float:right">${n}</strong></div><div class="bar"><i style="width:${total?100*n/total:0}%"></i></div>`}function render(){document.getElementById('nav').innerHTML=['＋ Lunch','Historik','Statistik','Inställningar'].map((s,i)=>`<button class="${tab===i?'active':''}" onclick="go(${i})">${s}</button>`).join('');let v='';if(tab===0){v=`<section><h2>Registrera lunch</h2><label for="day">Datum</label><input id="day" type="date" value="${esc(day)}" onchange="day=this.value"><label>Vilka var med?</label><div class="choices">${data.names.map((n,i)=>`<button class="${people.includes(i)?'active':''}" aria-pressed="${people.includes(i)}" ${i===0?'disabled':''} onclick="choose(${i})">${esc(n)}</button>`).join('')}</div><label>Vem bjöd?</label><div class="choices">${people.map(i=>`<button class="${payer===i?'active':''}" aria-pressed="${payer===i}" onclick="pay(${i})">${name(i)}</button>`).join('')}</div><button class="primary" ${people.length<2||!day?'disabled':''} onclick="add()">Spara lunch</button><div id="msg" role="status">${notice}</div></section><section><h2>Senaste lunchen</h2>${data.entries.length?entry([...data.entries].sort((a,b)=>b.day.localeCompare(a.day)||b.id.localeCompare(a.id))[0]):'<p>Här börjar din lunchdagbok.</p>'}</section>`}else if(tab===1){v=`<section><h2>Lunchhistorik</h2><small>${data.entries.length} registrerade luncher</small>${[...data.entries].sort((a,b)=>b.day.localeCompare(a.day)||b.id.localeCompare(a.id)).map(entry).join('')||'<p>Inga luncher ännu.</p>'}</section>`}else if(tab===2){let es=filtered(),n=es.length;v=`<label for="period">Period</label><select id="period" onchange="period=this.value;render()"><option value="all" ${period==='all'?'selected':''}>Alla luncher</option><option value="month" ${period==='month'?'selected':''}>Den här månaden</option><option value="year" ${period==='year'?'selected':''}>Det här året</option></select><section><small>Luncher tillsammans</small><div class="big">${n}</div>${stat(name(0)+' och '+name(1),es.filter(e=>e.people.length===2&&e.people.includes(1)).length,n)}${stat(name(0)+' och '+name(2),es.filter(e=>e.people.length===2&&e.people.includes(2)).length,n)}${stat('Alla tre',es.filter(e=>e.people.length===3).length,n)}</section><section><h2>Vem bjöd?</h2>${data.names.map((_,i)=>stat(name(i),es.filter(e=>e.payer===i).length,n)).join('')}<small>Antal lunchtillfällen, oavsett antal deltagare.</small></section><section><h2>Bjudningar mellan er</h2>${[[0,1],[0,2],[1,2]].map(([a,b])=>`<p><strong>${name(a)} &amp; ${name(b)}</strong><br>${name(a)} bjöd ${name(b)}: ${es.filter(e=>e.payer===a&&e.people.includes(b)).length}<br>${name(b)} bjöd ${name(a)}: ${es.filter(e=>e.payer===b&&e.people.includes(a)).length}</p>`).join('')}</section>`}else{v=`<section><h2>Namn</h2>${data.names.map((n,i)=>`<label for="n${i}">Person ${i+1}</label><input id="n${i}" maxlength="40" value="${esc(n)}">`).join('')}<button class="primary" onclick="rename()">Spara namn</button></section><section><h2>Din privata dagbok</h2><p>Uppgifterna sparas i webbläsaren på din enhet. Ingen inloggning eller synkronisering.</p><button onclick="backup()">Exportera säkerhetskopia</button><label for="restore">Återställ säkerhetskopia</label><input id="restore" type="file" accept="application/json,.json" onchange="restore(this)"><p class="muted">Spara en kopia regelbundet. Om webbplatsdata rensas kan historiken försvinna.</p></section>`}document.getElementById('view').innerHTML=v}function rename(){let old=data.names;data.names=old.map((n,i)=>document.getElementById('n'+i).value.trim()||n);if(!save())data.names=old;else alert('Namnen sparade.');render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='lunchkollen-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(el){try{let d=JSON.parse(await el.files[0].text());if(!Array.isArray(d.names)||d.names.length!==3||!d.names.every(n=>typeof n==='string'&&n.length<=40)||!Array.isArray(d.entries)||!d.entries.every(e=>e&&typeof e.id==='string'&&/^[a-z0-9]+$/.test(e.id)&&typeof e.day==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.day)&&Array.isArray(e.people)&&e.people.includes(0)&&e.people.length>=2&&e.people.length<=3&&new Set(e.people).size===e.people.length&&e.people.every(i=>[0,1,2].includes(i))&&e.people.includes(e.payer)))throw Error();if(confirm('Ersätta nuvarande dagbok med säkerhetskopian?')){let old=data;data=d;if(!save())data=old;render()}}catch{alert('Ogiltig säkerhetskopia.')}}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
